<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoJSON Comparator</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #181c27;
    --border: #2a2f3e;
    --accent: #4af0c4;
    --accent2: #f06090;
    --text: #e8eaf0;
    --muted: #6b7280;
    --panel-h: 56px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Top bar ── */
  header {
    height: var(--panel-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 16px;
    flex-shrink: 0;
    z-index: 1000;
  }

  header h1 {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    white-space: nowrap;
  }

  .divider { flex: 1; }

  .drop-zone {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    min-width: 180px;
  }

  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent);
    color: var(--text);
    background: rgba(74, 240, 196, 0.05);
  }

  .drop-zone.loaded {
    border-color: var(--accent);
    color: var(--accent);
  }

  .drop-zone.loaded.right {
    border-color: var(--accent2);
    color: var(--accent2);
  }

  .drop-zone .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border);
    flex-shrink: 0;
    transition: background 0.2s;
  }

  .drop-zone.loaded .dot { background: var(--accent); }
  .drop-zone.loaded.right .dot { background: var(--accent2); }

  input[type=file] { display: none; }

  /* ── Maps container ── */
  .maps-container {
    flex: 1;
    display: flex;
    position: relative;
    overflow: hidden;
  }

  .map-wrapper {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .map-wrapper + .map-wrapper {
    border-left: 2px solid var(--border);
  }

  .map-label {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 500;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 4px;
    pointer-events: none;
  }

  .map-label.left {
    background: rgba(74, 240, 196, 0.15);
    color: var(--accent);
    border: 1px solid rgba(74, 240, 196, 0.3);
  }

  .map-label.right {
    background: rgba(240, 96, 144, 0.15);
    color: var(--accent2);
    border: 1px solid rgba(240, 96, 144, 0.3);
  }

  .map { width: 100%; height: 100%; }

  /* ── Splitter ── */
  .splitter {
    width: 4px;
    background: var(--border);
    cursor: col-resize;
    flex-shrink: 0;
    position: relative;
    z-index: 600;
    transition: background 0.2s;
  }

  .splitter:hover { background: var(--accent); }

  /* ── Tooltip ── */
  .feature-tooltip {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    background: var(--surface) !important;
    border: 1px solid var(--border) !important;
    color: var(--text) !important;
    border-radius: 6px !important;
    padding: 6px 10px !important;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5) !important;
  }

  /* ── Empty state overlay ── */
  .empty-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(15,17,23,0.7);
    z-index: 400;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .empty-overlay.hidden { opacity: 0; pointer-events: none; }

  .empty-overlay span {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .empty-icon {
    font-size: 32px;
    opacity: 0.3;
  }

  /* ── Legend ── */
  .legend {
    position: absolute;
    bottom: 28px;
    right: 10px;
    z-index: 500;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    max-width: 210px;
    max-height: 260px;
    overflow-y: auto;
    display: none;
  }

  .legend.visible { display: block; }

  .legend-title {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text);
    margin-bottom: 4px;
    cursor: pointer;
    border-radius: 4px;
    padding: 2px 3px;
    transition: background 0.15s;
    user-select: none;
  }

  .legend-item:hover { background: rgba(255,255,255,0.05); }
  .legend-item.hidden-feature { opacity: 0.35; }

  .legend-toggle {
    width: 14px; height: 14px;
    border-radius: 3px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px;
    border: 1px solid rgba(255,255,255,0.15);
    transition: opacity 0.2s;
  }

  .legend-swatch {
    width: 12px; height: 12px;
    border-radius: 2px;
    flex-shrink: 0;
    cursor: pointer;
    position: relative;
    border: 1px solid rgba(255,255,255,0.15);
    transition: transform 0.15s;
  }

  .legend-swatch:hover { transform: scale(1.3); }

  .legend-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ── Color picker popup ── */
  .color-picker-popup {
    position: fixed;
    z-index: 9999;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    display: none;
  }

  .color-picker-popup.open { display: block; }

  .color-picker-title {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .color-grid {
    display: grid;
    grid-template-columns: repeat(5, 20px);
    gap: 5px;
  }

  .color-cell {
    width: 20px; height: 20px;
    border-radius: 3px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.12s, border-color 0.12s;
  }

  .color-cell:hover { transform: scale(1.2); }
  .color-cell.selected { border-color: #fff; }

  /* Leaflet overrides */
  .leaflet-control-zoom {
    border: 1px solid var(--border) !important;
    border-radius: 6px !important;
    overflow: hidden;
  }

  .leaflet-control-zoom a {
    background: var(--surface) !important;
    color: var(--text) !important;
    border-bottom: 1px solid var(--border) !important;
  }

  .leaflet-control-zoom a:hover {
    background: var(--bg) !important;
    color: var(--accent) !important;
  }

  .leaflet-control-attribution {
    background: rgba(15,17,23,0.8) !important;
    color: var(--muted) !important;
    font-size: 9px !important;
  }

  .leaflet-control-attribution a { color: var(--muted) !important; }

  /* Remove Leaflet focus outline on clicked features */
  .leaflet-interactive:focus { outline: none; }

  /* scrollbar */
  .legend::-webkit-scrollbar { width: 4px; }
  .legend::-webkit-scrollbar-track { background: transparent; }
  .legend::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<header>
  <h1>GeoJSON Comparator</h1>
  <div class="divider"></div>

  <label class="drop-zone" id="drop-left" for="file-left">
    <div class="dot"></div>
    <span id="label-left">Drop or click — Left map</span>
    <input type="file" id="file-left" accept=".geojson,.json">
  </label>

  <label class="drop-zone right" id="drop-right" for="file-right">
    <div class="dot"></div>
    <span id="label-right">Drop or click — Right map</span>
    <input type="file" id="file-right" accept=".geojson,.json">
  </label>
</header>

<div class="maps-container" id="maps-container">
  <div class="map-wrapper" id="wrapper-left">
    <div class="map-label left">A</div>
    <div class="map" id="map-left"></div>
    <div class="empty-overlay" id="empty-left">
      <div class="empty-icon">◧</div>
      <span>Load a GeoJSON file</span>
    </div>
    <div class="legend" id="legend-left"></div>
  </div>

  <div class="splitter" id="splitter"></div>

  <div class="map-wrapper" id="wrapper-right">
    <div class="map-label right">B</div>
    <div class="map" id="map-right"></div>
    <div class="empty-overlay" id="empty-right">
      <div class="empty-icon">◨</div>
      <span>Load a GeoJSON file</span>
    </div>
    <div class="legend" id="legend-right"></div>
  </div>
</div>

<!-- Color picker popup (shared, repositioned dynamically) -->
<div class="color-picker-popup" id="color-picker">
  <div class="color-picker-title">Pick color</div>
  <div class="color-grid" id="color-grid"></div>
</div>

<script>
// ── Palette: 20 distinct colors ──────────────────────────────────────────────
const PALETTE = [
  '#4af0c4','#f06090','#f0c040','#60a0f0','#c060f0',
  '#f08040','#40d0a0','#e060c0','#80c040','#40b0e0',
  '#f04060','#a0d060','#6080f0','#f0a020','#20d0d0',
  '#e08080','#80e0a0','#c0a040','#8060d0','#d06040'
];

// ── Map init ─────────────────────────────────────────────────────────────────
const TILE_URL = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
const TILE_ATTR = '© <a href="https://www.openstreetmap.org/copyright">OSM</a>';

const mapL = L.map('map-left', { zoomControl: true, attributionControl: true }).setView([47.49, 19.04], 11);
const mapR = L.map('map-right', { zoomControl: true, attributionControl: true }).setView([47.49, 19.04], 11);

L.tileLayer(TILE_URL, { attribution: TILE_ATTR, maxZoom: 19 }).addTo(mapL);
L.tileLayer(TILE_URL, { attribution: TILE_ATTR, maxZoom: 19 }).addTo(mapR);

// ── Sync ─────────────────────────────────────────────────────────────────────
let syncing = false;
function syncMaps(source, target) {
  source.on('moveend', () => {
    if (syncing) return;
    syncing = true;
    target.setView(source.getCenter(), source.getZoom(), { animate: false });
    syncing = false;
  });
}
syncMaps(mapL, mapR);
syncMaps(mapR, mapL);

// ── Per-side state: featureStates[side] = [{layer, color, visible, name, leafletLayer}, ...] ──
const featureStates = { left: [], right: [] };

// ── Color picker ─────────────────────────────────────────────────────────────
const pickerEl = document.getElementById('color-picker');
const colorGrid = document.getElementById('color-grid');
let pickerCallback = null;

// Build color grid once
PALETTE.forEach(hex => {
  const cell = document.createElement('div');
  cell.className = 'color-cell';
  cell.style.background = hex;
  cell.dataset.color = hex;
  cell.addEventListener('click', () => {
    if (pickerCallback) pickerCallback(hex);
    closeColorPicker();
  });
  colorGrid.appendChild(cell);
});

function openColorPicker(anchorEl, currentColor, callback) {
  pickerCallback = callback;
  // Mark current color
  colorGrid.querySelectorAll('.color-cell').forEach(c => {
    c.classList.toggle('selected', c.dataset.color === currentColor);
  });
  // Position near swatch
  const rect = anchorEl.getBoundingClientRect();
  pickerEl.style.left = Math.min(rect.left, window.innerWidth - 140) + 'px';
  pickerEl.style.top = (rect.bottom + 6) + 'px';
  pickerEl.classList.add('open');
}

function closeColorPicker() {
  pickerEl.classList.remove('open');
  pickerCallback = null;
}

document.addEventListener('click', e => {
  if (!pickerEl.contains(e.target) && !e.target.classList.contains('legend-swatch')) {
    closeColorPicker();
  }
});

// ── Build / refresh legend for a side ────────────────────────────────────────
function buildLegend(side) {
  const legendEl = document.getElementById(`legend-${side}`);
  legendEl.innerHTML = `<div class="legend-title">Features</div>`;

  featureStates[side].forEach((state, idx) => {
    const item = document.createElement('div');
    item.className = 'legend-item' + (state.visible ? '' : ' hidden-feature');
    item.dataset.idx = idx;

    // Toggle checkbox-style indicator
    const toggle = document.createElement('div');
    toggle.className = 'legend-toggle';
    toggle.style.background = state.visible ? state.color : 'transparent';
    toggle.style.borderColor = state.color;
    toggle.textContent = state.visible ? '✓' : '';
    toggle.style.color = '#000';
    toggle.style.fontWeight = 'bold';

    // Colored swatch (opens color picker)
    const swatch = document.createElement('div');
    swatch.className = 'legend-swatch';
    swatch.style.background = state.color;
    swatch.title = 'Change color';

    swatch.addEventListener('click', e => {
      e.stopPropagation();
      openColorPicker(swatch, state.color, (newColor) => {
        state.color = newColor;
        // Restyle the leaflet layer
        state.leafletLayer.setStyle({
          color: newColor,
          fillColor: newColor
        });
        buildLegend(side); // re-render legend
      });
    });

    // Name label
    const nameEl = document.createElement('span');
    nameEl.className = 'legend-name';
    nameEl.textContent = state.name;
    nameEl.title = state.name;

    item.appendChild(toggle);
    item.appendChild(swatch);
    item.appendChild(nameEl);

    // Click row (not swatch) = toggle visibility
    item.addEventListener('click', e => {
      if (e.target === swatch) return;
      state.visible = !state.visible;
      const map = side === 'left' ? mapL : mapR;
      if (state.visible) {
        state.leafletLayer.addTo(map);
      } else {
        state.leafletLayer.remove();
      }
      buildLegend(side);
    });

    legendEl.appendChild(item);
  });

  legendEl.classList.add('visible');
}

// ── GeoJSON loader ───────────────────────────────────────────────────────────
function loadGeoJSON(map, side, geojson) {
  const isLeft = side === 'left';

  // Remove old layers
  featureStates[side].forEach(s => s.leafletLayer.remove());
  featureStates[side] = [];

  const features = geojson.features || [];

  features.forEach((feature, idx) => {
    const color = PALETTE[idx % PALETTE.length];
    const name = feature.properties?.name || `Feature ${idx + 1}`;

    const lyr = L.geoJSON(feature, {
      style: {
        color, weight: 2, opacity: 0.9,
        fillColor: color, fillOpacity: 0.25
      }
    });

    lyr.bindTooltip(`<span>${name}</span>`, {
      className: 'feature-tooltip',
      sticky: true, direction: 'top', offset: [0, -4]
    });

    lyr.on('mouseover', () => lyr.setStyle({ weight: 3, fillOpacity: 0.45 }));
    lyr.on('mouseout', () => lyr.setStyle({ weight: 2, fillOpacity: 0.25 }));

    lyr.addTo(map);

    featureStates[side].push({ leafletLayer: lyr, color, visible: true, name });
  });

  // Fit bounds using a combined group
  const group = L.featureGroup(featureStates[side].map(s => s.leafletLayer));
  if (group.getBounds().isValid()) {
    map.fitBounds(group.getBounds(), { padding: [24, 24] });
    const other = isLeft ? mapR : mapL;
    syncing = true;
    other.setView(map.getCenter(), map.getZoom(), { animate: false });
    syncing = false;
  }

  buildLegend(side);

  document.getElementById(`empty-${side}`).classList.add('hidden');
  const fname = geojson._filename || 'file loaded';
  document.getElementById(`label-${side}`).textContent = `✓ ${fname}`;
  document.getElementById(`drop-${side}`).classList.add('loaded');
}

// ── File input handling ───────────────────────────────────────────────────────
function handleFile(file, side) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const geojson = JSON.parse(e.target.result);
      geojson._filename = file.name;
      loadGeoJSON(side === 'left' ? mapL : mapR, side, geojson);
    } catch {
      alert('Could not parse file as GeoJSON/JSON.');
    }
  };
  reader.readAsText(file);
}

document.getElementById('file-left').addEventListener('change', e => {
  if (e.target.files[0]) handleFile(e.target.files[0], 'left');
});
document.getElementById('file-right').addEventListener('change', e => {
  if (e.target.files[0]) handleFile(e.target.files[0], 'right');
});

// ── Drag & drop ───────────────────────────────────────────────────────────────
['left','right'].forEach(side => {
  const zone = document.getElementById(`drop-${side}`);
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('dragover');
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0], side);
  });

  const wrapper = document.getElementById(`wrapper-${side}`);
  wrapper.addEventListener('dragover', e => e.preventDefault());
  wrapper.addEventListener('drop', e => {
    e.preventDefault();
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0], side);
  });
});

// ── Splitter drag ─────────────────────────────────────────────────────────────
const splitter = document.getElementById('splitter');
const container = document.getElementById('maps-container');
const wrapL = document.getElementById('wrapper-left');
const wrapR = document.getElementById('wrapper-right');

let dragging = false, startX = 0, startLeftW = 0;

splitter.addEventListener('mousedown', e => {
  dragging = true; startX = e.clientX;
  startLeftW = wrapL.getBoundingClientRect().width;
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
});

document.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - startX;
  const totalW = container.getBoundingClientRect().width - splitter.offsetWidth;
  const newLeft = Math.min(Math.max(startLeftW + dx, totalW * 0.2), totalW * 0.8);
  wrapL.style.flex = 'none'; wrapR.style.flex = 'none';
  wrapL.style.width = newLeft + 'px';
  wrapR.style.width = (totalW - newLeft) + 'px';
  mapL.invalidateSize(); mapR.invalidateSize();
});

document.addEventListener('mouseup', () => {
  if (dragging) {
    dragging = false;
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    mapL.invalidateSize(); mapR.invalidateSize();
  }
});

window.addEventListener('resize', () => { mapL.invalidateSize(); mapR.invalidateSize(); });
</script>
</body>
</html>
